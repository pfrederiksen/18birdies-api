name: Test And Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Development Dependencies
        run: python -m pip install -e ".[dev,timezones]"
      - name: Standard Library Tests
        run: python -m unittest discover -s tests -v
      - name: Pytest
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Build Wheel And Source Archive
        run: python -m build
      - name: Validate Distribution Metadata
        shell: bash
        run: python -m twine check dist/*
      - name: Install Built Wheel
        shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: CLI Smoke Test
        run: 18birdies --export examples/synthetic-export.json summary --json
      - name: Module Smoke Test
        run: python -m eighteenbirdies --export examples/synthetic-export.json capabilities --json
