[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "18birdies-api"
version = "0.1.0"
description = "Unofficial local-first Python SDK and CLI for official 18Birdies JSON exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "18birdies-api contributors"}]
keywords = ["golf", "18birdies", "offline", "export", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "packaging>=24.2", "pytest>=8", "ruff>=0.8", "twine>=6.1"]
timezones = ["tzdata>=2024.1"]

[project.urls]
Homepage = "https://github.com/pfrederiksen/18birdies-api"
Repository = "https://github.com/pfrederiksen/18birdies-api"
Issues = "https://github.com/pfrederiksen/18birdies-api/issues"
Changelog = "https://github.com/pfrederiksen/18birdies-api/blob/main/CHANGELOG.md"

[project.scripts]
18birdies = "eighteenbirdies.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eighteenbirdies = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
